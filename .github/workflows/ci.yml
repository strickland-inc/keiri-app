name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v7

      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 依存関係を入れる
        run: npm ci

      - name: lint
        run: npm run lint

      - name: 書式の検査
        run: npm run format:check

      - name: テスト
        run: npm test

      - name: Cloudflare Workers 用のビルド
        run: npm run build:vinext
